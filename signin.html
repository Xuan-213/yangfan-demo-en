<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yang Fan — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* ===== Yang Fan Sign-In — Landing Page Design System ===== */
:root {
  --g50:  oklch(0.97 0.025 145);  --g100: oklch(0.94 0.05 145);
  --g200: oklch(0.88 0.09 145);  --g300: oklch(0.78 0.13 145);
  --g400: oklch(0.70 0.16 145);  --g500: oklch(0.65 0.18 145);
  --g600: oklch(0.55 0.15 145);  --g700: oklch(0.44 0.13 145);
  --g800: oklch(0.34 0.10 145);  --g900: oklch(0.25 0.07 145);

  --n0: oklch(1 0 0);            --n50: oklch(0.988 0.004 96);
  --n100: oklch(0.968 0.006 96);  --n200: oklch(0.925 0.010 96);
  --n300: oklch(0.865 0.012 96);  --n400: oklch(0.725 0.012 96);
  --n500: oklch(0.585 0.012 96);  --n600: oklch(0.465 0.010 96);
  --n700: oklch(0.345 0.008 96);  --n800: oklch(0.225 0.006 96);
  --n900: oklch(0.135 0.004 96);

  --danger: oklch(0.55 0.19 18);
  --font: 'DM Sans', 'Inter', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font); background: var(--n50); color: var(--n800);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}

/* ===== Decorative Blobs (matching landing page) ===== */
.blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.blob { position: absolute; border-radius: 50%; animation: blobFloat 16s ease-in-out infinite; }
.blob-1 { width: 600px; height: 600px; top: -15%; right: -10%;
  background: radial-gradient(circle, oklch(0.65 0.18 145 / 0.18), transparent 70%);
  animation-delay: 0s; }
.blob-2 { width: 500px; height: 500px; bottom: -12%; left: -8%;
  background: radial-gradient(circle, oklch(0.78 0.14 83 / 0.14), transparent 70%);
  animation-delay: 3s; animation-duration: 18s; }
.blob-3 { width: 400px; height: 400px; top: 40%; left: 55%;
  background: radial-gradient(circle, oklch(0.69 0.10 230 / 0.10), transparent 70%);
  animation-delay: 6s; animation-duration: 14s; }

@keyframes blobFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25%  { transform: translate(30px, -30px) scale(1.05); }
  50%  { transform: translate(-20px, 20px) scale(0.95); }
  75%  { transform: translate(-30px, -10px) scale(1.02); }
}

/* ===== Card ===== */
.wrapper { position: relative; z-index: 1; animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.card {
  width: 440px; max-width: calc(100vw - 32px);
  background: rgba(255,255,255,0.82); backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 20px; padding: 40px 36px;
  box-shadow: 0 4px 24px oklch(0 0 0 / 0.05), 0 1px 2px oklch(0 0 0 / 0.04);
}

/* ===== Headline ===== */
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
.brand-icon {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg, var(--g400), var(--g600));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px;
}
.card-title { font-size: 22px; font-weight: 700; color: var(--n800); text-align: center; letter-spacing: -0.3px; }
.card-subtitle { font-size: 14px; font-weight: 500; color: var(--n500); text-align: center; margin-bottom: 24px; }

/* ===== Mode Tabs ===== */
.mode-tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--n100); border-radius: 12px; padding: 4px; }
.mode-tab {
  flex: 1; padding: 8px 12px; text-align: center;
  font-size: 13px; font-weight: 600; font-family: var(--font);
  color: var(--n500); background: transparent; border: none;
  border-radius: 9px; cursor: pointer; transition: all 0.2s ease;
}
.mode-tab.active { background: #fff; color: var(--n800); box-shadow: 0 1px 3px oklch(0 0 0 / 0.08); }

/* ===== Role Selector ===== */
.role-label { font-size: 13px; font-weight: 600; color: var(--n500); margin-bottom: 8px; }
.role-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
.role-tab {
  flex: 1; padding: 10px 8px; text-align: center;
  font-size: 14px; font-weight: 600; font-family: var(--font);
  color: var(--n500); background: var(--n100); border: 1.5px solid transparent;
  border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
}
.role-tab:hover { background: var(--n200); }
.role-tab.active { background: var(--g50); border-color: var(--g300); color: var(--g600); }

/* ===== Form Fields ===== */
.f-grp { margin-bottom: 18px; }
.f-lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--n600); margin-bottom: 6px; }
.f-lbl a { font-size: 12px; font-weight: 500; color: var(--n400); text-decoration: none; transition: color 0.2s; }
.f-lbl a:hover { color: var(--g500); }
.f-inp {
  width: 100%; height: 44px; padding: 0 14px;
  background: var(--n50); border: 1.5px solid var(--n200);
  border-radius: 10px; font-size: 14px; font-family: var(--font); color: var(--n800);
  outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.f-inp::placeholder { color: var(--n400); }
.f-inp:focus { border-color: var(--g400); box-shadow: 0 0 0 3px oklch(0.65 0.18 145 / 0.12); }
.f-inp.error { border-color: var(--danger); box-shadow: 0 0 0 3px oklch(0.55 0.19 18 / 0.1); }

/* ===== Remember Me ===== */
.remember-row { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 22px; padding-top: 2px; }
.chk-wrap {
  width: 20px; height: 20px; border: 1.5px solid var(--n300); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.2s ease;
}
.chk-wrap.checked { background: var(--g500); border-color: var(--g500); }
.chk-wrap svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s; }
.chk-wrap.checked svg { opacity: 1; }
.rm-lbl { font-size: 13px; font-weight: 500; color: var(--n500); user-select: none; }

/* ===== Submit Button (matching Hero.jsx CTA) ===== */
.btn-submit {
  width: 100%; height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--g500); border: none; border-radius: 9999px;
  color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font);
  cursor: pointer;
  box-shadow: 0 4px 16px oklch(0.65 0.18 145 / 0.28);
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn-submit:hover { background: var(--g600); transform: translateY(-1px); box-shadow: 0 6px 24px oklch(0.65 0.18 145 / 0.4); }
.btn-submit:active { transform: scale(0.97); }

/* ===== Bottom Link ===== */
.bottom-link { text-align: center; margin-top: 22px; font-size: 13px; font-weight: 500; color: var(--n500); }
.bottom-link a { font-weight: 600; color: var(--g600); text-decoration: none; cursor: pointer; transition: color 0.2s; }
.bottom-link a:hover { color: var(--g700); }

/* ===== Success Overlay ===== */
.success-overlay {
  position: fixed; inset: 0; background: rgba(255,255,255,0.97); z-index: 100;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
}
.success-overlay.show { opacity: 1; pointer-events: auto; }
.s-icon {
  width: 64px; height: 64px; border-radius: 50%; background: var(--g500);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: #fff;
  animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.s-msg { font-size: 18px; font-weight: 700; color: var(--n800); margin-top: 16px; }
.s-sub { font-size: 14px; color: var(--n500); margin-top: 6px; }

/* ===== Responsive ===== */
@media (max-width: 480px) {
  .card { padding: 28px 20px; border-radius: 16px; }
  .card-title { font-size: 20px; }
  .role-tab { font-size: 13px; padding: 8px 6px; }
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="wrapper">
  <div class="card">
    <div class="brand">
      <div class="brand-icon">⛵</div>
      <span style="font-weight:600;font-size:15px;color:var(--n800);">Yang Fan</span>
    </div>
    <h1 class="card-title" id="cardTitle">Sign In</h1>
    <p class="card-subtitle" id="cardSubtitle">Enter your email and password to continue</p>

    <!-- Mode Tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="signin" onclick="switchMode('signin')">Sign In</button>
      <button class="mode-tab" data-mode="register" onclick="switchMode('register')">Create Account</button>
    </div>

    <!-- Role Selector -->
    <p class="role-label">Select Role</p>
    <div class="role-tabs">
      <button class="role-tab active" data-role="mentor" onclick="sel('mentor',this)">Mentor</button>
      <button class="role-tab" data-role="intern" onclick="sel('intern',this)">Intern</button>
      <button class="role-tab" data-role="hr" onclick="sel('hr',this)">HR</button>
    </div>

    <!-- Full Name (register only) -->
    <div class="f-grp" id="nameGroup" style="display:none">
      <label class="f-lbl">Full Name</label>
      <input class="f-inp" type="text" id="name" placeholder="Enter your full name" autocomplete="name">
    </div>

    <!-- Email -->
    <div class="f-grp">
      <label class="f-lbl">Email Address</label>
      <input class="f-inp" type="email" id="email" placeholder="Enter your email address" autocomplete="email">
    </div>

    <!-- Password -->
    <div class="f-grp">
      <label class="f-lbl">
        Password
        <a href="#" id="forgotLink">Forgot password?</a>
      </label>
      <input class="f-inp" type="password" id="pw" placeholder="············" autocomplete="current-password">
    </div>

    <!-- Remember Me (sign-in only) -->
    <div class="remember-row" id="rememberRow" onclick="togRemember()">
      <div class="chk-wrap" id="chk"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="3,7 6,10 11,4"/></svg></div>
      <span class="rm-lbl">Remember me</span>
    </div>

    <!-- Submit -->
    <button class="btn-submit" id="actionBtn" onclick="handleSubmit()">
      <span id="btnText">Sign In</span>
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
    </button>

    <p class="bottom-link" id="bottomLink">
      Don't have an account? <a href="#" onclick="switchMode('register');return false;">Create account</a>
    </p>
  </div>
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="success">
  <div class="s-icon">✓</div>
  <div class="s-msg" id="sMsg">Signed in successfully!</div>
  <div class="s-sub" id="sSub">Redirecting...</div>
</div>

<script>
// ===== State =====
var params = new URLSearchParams(window.location.search);
var urlRole = params.get('role');
var role = (urlRole === 'mentor' || urlRole === 'intern' || urlRole === 'hr') ? urlRole : 'mentor';
var mode = 'signin';
var rm = false;

// ===== Init =====
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.role-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.role === role);
  });
});

// ===== Role Selection =====
function sel(r, b) {
  role = r;
  document.querySelectorAll('.role-tab').forEach(function (t) { t.classList.remove('active'); });
  b.classList.add('active');
}

// ===== Mode Switching =====
function switchMode(newMode) {
  if (mode === newMode) return;
  mode = newMode;
  var isSignin = (mode === 'signin');

  document.querySelectorAll('.mode-tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.mode === mode);
  });

  document.getElementById('cardTitle').textContent = isSignin ? 'Sign In' : 'Create Account';
  document.getElementById('cardSubtitle').textContent = isSignin
    ? 'Enter your email and password to continue'
    : 'Fill in your details to get started';

  document.getElementById('nameGroup').style.display = isSignin ? 'none' : 'block';
  document.getElementById('rememberRow').style.display = isSignin ? 'flex' : 'none';
  document.getElementById('forgotLink').style.display = isSignin ? 'inline' : 'none';

  document.getElementById('btnText').textContent = isSignin ? 'Sign In' : 'Create Account';

  document.getElementById('bottomLink').innerHTML = isSignin
    ? "Don't have an account? <a href=\"#\" onclick=\"switchMode('register');return false;\">Create account</a>"
    : "Already have an account? <a href=\"#\" onclick=\"switchMode('signin');return false;\">Sign in</a>";

  // Clear fields
  document.getElementById('email').value = '';
  document.getElementById('pw').value = '';
  var nameEl = document.getElementById('name');
  if (nameEl) nameEl.value = '';
  document.querySelectorAll('.f-inp').forEach(function (el) { el.classList.remove('error'); });
  rm = false;
  document.getElementById('chk').classList.remove('checked');
}

// ===== Remember Me =====
function togRemember() {
  rm = !rm;
  document.getElementById('chk').classList.toggle('checked', rm);
}

// ===== Validation =====
function showError(el) {
  el.classList.add('error');
  setTimeout(function () { el.classList.remove('error'); }, 1500);
}

// ===== Submit =====
function handleSubmit() {
  var emailEl = document.getElementById('email');
  var pwEl = document.getElementById('pw');
  var nameEl = document.getElementById('name');

  var email = emailEl.value.trim();
  var pw = pwEl.value.trim();

  if (!email) { showError(emailEl); return; }
  if (mode === 'register') {
    var name = nameEl.value.trim();
    if (!name) { showError(nameEl); return; }
  }
  if (!pw) { showError(pwEl); return; }
  if (mode === 'register' && pw.length < 6) { showError(pwEl); return; }

  var dashboards = { mentor: 'mentor_dashboard.html', intern: 'intern.html', hr: 'hr_v3_dashboard.html' };
  var dashboardNames = { mentor: 'Mentor Workspace', intern: 'Intern System', hr: 'HR Dashboard' };

  document.getElementById('sMsg').textContent = (mode === 'register')
    ? 'Account created successfully!'
    : 'Signed in successfully!';
  document.getElementById('sSub').textContent = 'Redirecting to ' + dashboardNames[role] + '...';
  document.getElementById('success').classList.add('show');

  setTimeout(function () { window.location.href = dashboards[role]; }, 1200);
}

// ===== Enter Key =====
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') handleSubmit();
});
</script>

</body>
</html>
