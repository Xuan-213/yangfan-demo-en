<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yang Fan · InternDetails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* ===== YANG FAN V3 DESIGN SYSTEM ===== */
:root {
  --green-50:oklch(0.97 0.025 145);--green-100:oklch(0.94 0.05 145);--green-200:oklch(0.88 0.09 145);--green-300:oklch(0.78 0.13 145);
  --green-400:oklch(0.68 0.16 145);--green-500:oklch(0.60 0.17 145);--green-600:oklch(0.52 0.15 145);--green-700:oklch(0.44 0.13 145);
  --neutral-0:oklch(1 0 0);--neutral-50:oklch(0.985 0.004 96);--neutral-100:oklch(0.965 0.007 96);--neutral-200:oklch(0.92 0.010 96);
  --neutral-300:oklch(0.86 0.012 96);--neutral-400:oklch(0.72 0.012 96);--neutral-500:oklch(0.58 0.012 96);
  --neutral-600:oklch(0.46 0.010 96);--neutral-700:oklch(0.34 0.008 96);--neutral-800:oklch(0.22 0.006 96);--neutral-900:oklch(0.13 0.004 96);
  --bg-app:oklch(0.978 0.006 145);--bg-card:var(--neutral-0);--bg-header:oklch(1 0 0 / 0.82);--bg-stat:var(--neutral-50);
  --primary:var(--green-500);--primary-hover:var(--green-600);--primary-light:var(--green-50);--primary-text:oklch(0.44 0.13 145);
  --text-primary:var(--neutral-900);--text-secondary:var(--neutral-600);--text-muted:var(--neutral-500);--text-nav:var(--neutral-600);
  --border:oklch(0.91 0.008 145);--border-light:oklch(0.95 0.005 145);--border-header:oklch(0.95 0.005 145);
  --shadow-xs:0 1px 2px oklch(0 0 0 / 0.03);--shadow-sm:0 2px 8px oklch(0 0 0 / 0.05);
  --shadow-md:0 4px 20px oklch(0 0 0 / 0.07);--shadow-lg:0 8px 40px oklch(0 0 0 / 0.09);--shadow-xl:0 16px 60px oklch(0 0 0 / 0.12);
  --danger:oklch(0.55 0.19 18);--danger-light:oklch(0.96 0.02 18);--warning:oklch(0.65 0.14 75);--warning-light:oklch(0.96 0.04 75);
  --info:oklch(0.52 0.16 250);--info-light:oklch(0.95 0.03 250);--purple:oklch(0.48 0.16 280);--purple-light:oklch(0.94 0.03 280);
  --font:'DM Sans',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--font-heading:'DM Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --text-xs:clamp(0.625rem,0.6rem + 0.1vw,0.75rem);--text-sm:clamp(0.75rem,0.72rem + 0.15vw,0.875rem);--text-base:clamp(0.875rem,0.85rem + 0.2vw,1rem);
  --text-lg:clamp(1rem,0.95rem + 0.25vw,1.25rem);--text-xl:clamp(1.125rem,1.05rem + 0.4vw,1.5rem);--text-2xl:clamp(1.25rem,1.15rem + 0.5vw,1.75rem);--text-3xl:clamp(1.5rem,1.3rem + 0.8vw,2.25rem);
  --leading-tight:1.2;--leading-normal:1.5;--leading-relaxed:1.7;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-2xl:24px;--r-full:9999px;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-std:cubic-bezier(0.4,0,0.2,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur-fast:120ms;--dur-normal:200ms;--dur-slow:350ms;--dur-page:400ms;
  --sidebar-w:264px;--topbar-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg-app);color:var(--text-primary);min-height:100vh;line-height:var(--leading-normal)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:2px}
::selection{background:var(--green-100);color:var(--green-800)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}

.topbar{background:var(--bg-header);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--border-light);height:64px;display:flex;align-items:center;gap:16px;padding:0 var(--sp-8);position:fixed;top:0;left:0;right:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:var(--sp-4)}
.btn-back{display:flex;align-items:center;gap:6px;padding:var(--sp-2) var(--sp-4);border-radius:var(--r-full);border:none;background:transparent;color:var(--text-nav);font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:var(--font);transition:all var(--dur-fast)}
.btn-back:hover{background:var(--neutral-50);color:var(--text-primary)}
.btn-back svg{width:18px;height:18px}
.topbar-title{font-size:var(--text-base);font-weight:700;color:var(--text-primary);font-family:var(--font-heading)}
.topbar-spacer{flex:1}
.btn-green{padding:var(--sp-2) var(--sp-5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:var(--font);border:none;background:var(--primary);color:#fff;transition:all var(--dur-fast);display:inline-flex;align-items:center;justify-content:center}
.btn-green:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 16px oklch(0.6 0.17 145 / 0.3)}
.btn-green:active{transform:scale(0.97)}
.btn-ghost-sm{padding:var(--sp-2) var(--sp-5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:500;cursor:pointer;font-family:var(--font);border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-secondary);transition:all var(--dur-fast);display:inline-flex;align-items:center;justify-content:center}
.btn-ghost-sm:hover{background:var(--neutral-50);color:var(--text-primary)}

.main{padding-top:calc(var(--topbar-h) + var(--sp-8));padding-left:120px;padding-right:120px;padding-bottom:var(--sp-20);display:flex;flex-direction:column;gap:var(--sp-5)}

.hero-card{background:linear-gradient(155deg,var(--neutral-800),var(--neutral-900));border-radius:var(--r-2xl);box-shadow:var(--shadow-lg);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-5);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-8);flex-wrap:wrap;position:relative;overflow:hidden}
.hero-card::after{content:'';position:absolute;top:-120px;right:-80px;width:420px;height:420px;background:radial-gradient(circle,var(--green-500) 0%,transparent 70%);opacity:.05;border-radius:50%;pointer-events:none}
.hero-card::before{content:'';position:absolute;bottom:-80px;left:15%;width:300px;height:300px;background:radial-gradient(circle,var(--purple) 0%,transparent 70%);opacity:.04;border-radius:50%;pointer-events:none}
.hero-left{display:flex;align-items:center;gap:var(--sp-5);position:relative;z-index:1}
.hero-av{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex-shrink:0;border:2px solid oklch(1 0 0 / 0.2)}
.hero-info{display:flex;flex-direction:column;gap:4px}
.hero-tag{font-size:var(--text-xs);font-weight:700;color:var(--green-400);text-transform:uppercase;letter-spacing:.06em}
.hero-name{font-size:var(--text-2xl);font-weight:800;color:#fff;font-family:var(--font-heading)}
.hero-meta{font-size:var(--text-sm);color:oklch(1 0 0 / 0.55);line-height:1.5}
.hero-tags{display:flex;gap:var(--sp-2);flex-wrap:wrap;padding-top:var(--sp-1)}
.htag{padding:4px 12px;border-radius:var(--r-full);font-size:var(--text-xs);font-weight:600}
.htag.purple{background:oklch(1 0 0 / 0.1);color:var(--purple)}
.htag.gray{background:oklch(1 0 0 / 0.08);color:oklch(1 0 0 / 0.7)}
.hero-stat-box{flex:0 0 110px;background:oklch(1 0 0 / 0.06);border:1px solid oklch(1 0 0 / 0.08);border-radius:var(--r-xl);padding:var(--sp-5);text-align:center;position:relative;z-index:1}
.hero-stat-num{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;color:var(--green-400);font-family:var(--font-heading);line-height:1.2}
.hero-stat-label{font-size:var(--text-xs);font-weight:500;color:oklch(1 0 0 / 0.5);margin-top:var(--sp-1)}
.hero-btns{display:flex;gap:var(--sp-2);flex-direction:column;flex-shrink:0;position:relative;z-index:1}
.btn-white{padding:var(--sp-3) var(--sp-5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:var(--font);border:none;background:#fff;color:var(--text-primary);transition:all var(--dur-fast)}
.btn-white:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn-outline-w{padding:var(--sp-3) var(--sp-5);border-radius:var(--r-full);font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid oklch(1 0 0 / 0.2);background:transparent;color:#fff;transition:all var(--dur-fast)}
.btn-outline-w:hover{background:oklch(1 0 0 / 0.1);border-color:oklch(1 0 0 / 0.3)}
.emp{text-align:center;padding:var(--sp-12);font-size:var(--text-base);color:var(--text-muted)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-5)}
.section-head h3{font-size:var(--text-lg);font-weight:700;color:var(--text-primary);font-family:var(--font-heading)}
.badge-sm{background:var(--neutral-50);padding:3px 12px;border-radius:var(--r-full);font-size:var(--text-xs);color:var(--text-muted);font-weight:600}
.badge-sm.purple{background:var(--purple-light);color:var(--purple)}

.bh-section{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-2xl);box-shadow:var(--shadow-xs);padding:var(--sp-8);display:flex;flex-direction:column;margin-bottom:var(--sp-5);transition:all var(--dur-normal) var(--ease-std)}
.bh-section:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border)}
.bh-section .section-head{margin-bottom:var(--sp-5)}

.rpt-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-xl);padding:var(--sp-8);margin-bottom:var(--sp-5);transition:all var(--dur-normal) var(--ease-std)}
.rpt-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border)}
.rpt-sec-body{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.8;white-space:pre-wrap;padding:var(--sp-6);background:var(--neutral-50);border-radius:var(--r-md);margin-top:var(--sp-3)}
.rpt-placeholder{font-size:var(--text-sm);color:var(--text-muted);padding:var(--sp-6);background:var(--neutral-50);border-radius:var(--r-md);text-align:center;margin-top:var(--sp-3)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--sp-5);margin-bottom:var(--sp-5)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4);margin-bottom:var(--sp-5)}
.stat-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-xl);padding:var(--sp-6);text-align:center;transition:all var(--dur-normal) var(--ease-std)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border)}
.metric{display:flex;align-items:center;gap:var(--sp-3)}
.metric-bar{flex:1;height:8px;background:var(--neutral-100);border-radius:4px;overflow:hidden}
.metric-fill{height:100%;border-radius:4px;transition:width 1s var(--ease-out)}

.tl-grid{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:var(--sp-4);padding:var(--sp-4) 0;position:relative}
.tl-content{flex:1;font-size:var(--text-sm);color:var(--text-secondary);line-height:1.6}
.tl-expand{display:none;margin-top:var(--sp-3);padding:var(--sp-4) 0 var(--sp-4) 16px;border-top:1px solid var(--border-light);font-size:var(--text-xs);color:var(--text-secondary);line-height:1.8;animation:tlExpandIn .2s var(--ease-std)}
.tl-expand.show{display:block}
@keyframes tlExpandIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.tl-exp-lbl{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--sp-1)}
.tl-exp-txt{font-size:var(--text-xs);color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.iv-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-2xl);box-shadow:var(--shadow-xs);padding:var(--sp-8);margin-bottom:var(--sp-5);transition:all var(--dur-normal) var(--ease-std)}
.iv-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border)}

@keyframes a-fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.a-up{animation:a-fadeUp var(--dur-slow) var(--ease-std) both}
.a-up.d1{animation-delay:.04s}.a-up.d2{animation-delay:.08s}.a-up.d3{animation-delay:.12s}

@media(max-width:1024px){.main{padding-left:var(--sp-5);padding-right:var(--sp-5)}.card-grid,.stat-grid{grid-template-columns:1fr}}
@media(max-width:768px){.hero-card{flex-direction:column}.stat-grid{grid-template-columns:1fr 1fr}.main{padding-left:var(--sp-4);padding-right:var(--sp-4);gap:var(--sp-4)}}
@media(hover:none) and (pointer:coarse){.stat-card:hover{transform:none;box-shadow:var(--shadow-xs)}}

/* ===== TABS ===== */
.tab-bar{display:flex;gap:4px;padding:0 0 var(--sp-4) 0;border-bottom:1px solid var(--border-light);margin-bottom:var(--sp-5)}
.tab-btn{padding:var(--sp-2) var(--sp-5);border-radius:var(--r-full);border:none;background:transparent;color:var(--text-muted);font-size:var(--text-sm);font-weight:600;cursor:pointer;font-family:var(--font);transition:all var(--dur-fast)}
.tab-btn:hover{background:var(--neutral-50);color:var(--text-primary)}
.tab-btn.active{background:var(--primary);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}

/* ===== LAYOUT GRIDS ===== */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-5)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
.card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-2xl);box-shadow:var(--shadow-xs);padding:var(--sp-8);transition:all var(--dur-normal) var(--ease-std)}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border)}
.grid-aside{display:flex;gap:var(--sp-5);margin-bottom:var(--sp-5);align-items:stretch}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.main-col>.card{flex:1}
.side-col{flex:0 0 340px;display:flex;flex-direction:column}
.side-col>.card{flex:1}

/* ===== STATS ROW ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-5)}
.stat-card .val{font-size:var(--text-2xl);font-weight:800;color:var(--text-primary);font-family:var(--font-heading);line-height:1.2}
.stat-card .lbl{font-size:var(--text-xs);font-weight:500;color:var(--text-muted);margin-top:var(--sp-1)}

/* ===== WEEK SELECTOR ===== */
.wk-select{padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-primary);font-size:var(--text-xs);font-weight:600;cursor:pointer;font-family:var(--font)}
.wk-select:focus{outline:2px solid var(--primary);outline-offset:2px}

/* ===== CHART BOX ===== */
.chart-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-xl);padding:var(--sp-5);transition:all var(--dur-normal) var(--ease-std);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px}
.chart-box svg{display:block;margin:0 auto}
.chart-box:hover{border-color:var(--border);box-shadow:var(--shadow-sm)}
.chart-legend{display:flex;gap:var(--sp-4);margin-top:var(--sp-2);font-size:var(--text-xs);color:var(--text-muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.ld{display:inline-block;width:10px;height:10px;border-radius:3px}

/* ===== TIMELINE ===== */
.tl-wk{margin-top:var(--sp-4)}
.tl-wk-hd{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4);padding-bottom:var(--sp-3);border-bottom:1px solid var(--border-light)}
.tl-wk-lbl{font-size:var(--text-sm);font-weight:700;color:var(--text-primary)}
.tl-wk-dt{font-size:var(--text-xs);color:var(--text-muted);margin-left:auto}
.tl-item{background:var(--neutral-50);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-3);cursor:pointer;transition:all var(--dur-fast) var(--ease-std);user-select:none}
.tl-item:hover{background:var(--green-50);border-color:var(--green-200);box-shadow:var(--shadow-sm);transform:translateX(2px)}
.tl-item.open{background:var(--bg-card);border-color:var(--green-300);box-shadow:var(--shadow-sm)}
.tl-item-hd{display:flex;flex-direction:column;gap:6px}
.tl-item-top{display:flex;align-items:center;justify-content:space-between}
.tl-item-name{font-size:var(--text-sm);font-weight:700;color:var(--text-primary);padding-left:16px;position:relative}
.tl-item-name::before{content:'▶';font-size:8px;color:var(--text-muted);position:absolute;left:0;top:50%;transform:translateY(-50%);transition:transform var(--dur-fast) var(--ease-std)}
.tl-item.open .tl-item-name::before{transform:translateY(-50%) rotate(90deg);color:var(--primary)}
.tl-item-meta{font-size:var(--text-xs);font-weight:700;color:var(--primary);background:var(--green-50);padding:3px 10px;border-radius:var(--r-full)}
.tl-item.open .tl-item-meta{background:var(--primary);color:#fff}
.tl-item-hint{font-size:10px;color:var(--text-muted);font-weight:400}
.tl-item.open .tl-item-hint{color:var(--primary)}

/* ===== INTERVIEW CARD ===== */
.iv-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)}
.iv-type{font-size:var(--text-sm);font-weight:700;color:var(--text-primary)}
.iv-date{font-size:var(--text-xs);color:var(--text-muted)}
.iv-summary{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.7;margin-bottom:var(--sp-4)}
.iv-points{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.iv-point{background:var(--green-50);color:var(--primary-text);padding:3px 12px;border-radius:var(--r-full);font-size:var(--text-xs);font-weight:600}
.iv-next{font-size:var(--text-xs);color:var(--text-muted);padding-top:var(--sp-2);border-top:1px solid var(--border-light)}

/* ===== REPORT ===== */
.rpt-item{margin-top:var(--sp-4)}
.rpt-hd{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.rpt-title{font-size:var(--text-sm);font-weight:600;color:var(--text-primary)}
.rpt-score{font-size:var(--text-xs);font-weight:700;padding:2px 10px;border-radius:var(--r-full)}
.rpt-score.high{background:var(--green-50);color:var(--primary-text)}
.rpt-score.mid{background:var(--warning-light);color:#b45309}
.rpt-score.low{background:var(--danger-light);color:var(--danger)}
.rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
.rpt-col{display:flex;flex-direction:column;gap:var(--sp-2)}
.rpt-col-lbl{font-size:var(--text-xs);font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.rpt-col-txt{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.8;white-space:pre-wrap;padding:var(--sp-5);background:var(--neutral-50);border-radius:var(--r-md)}
.rpt-sec-title{font-size:var(--text-sm);font-weight:700;color:var(--text-primary);margin-bottom:var(--sp-2);display:flex;align-items:center;gap:var(--sp-2)}
.rpt-sec-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px}
.rpt-sec-icon.work{background:#dbeafe;color:#2563eb}
.rpt-sec-icon.growth{background:#d1fae5;color:#059669}

    {id:'overall',icon:'📊',label:'Overall Assessment',hint:'Overall Assessment',req:true},
    {id:'skill',icon:'🎯',label:'Knowledge & Skills',hint:'Professional Skills & Tools',req:false},
    {id:'process',icon:'🔄',label:'Methods & Process',hint:'Work Methods & Process',req:false},
    {id:'attitude',icon:'🌟',label:'Attitude & Habits',hint:'Proactiveness、Collaboration & Time Mgmt',req:false},
    {id:'improve',icon:'📈',label:'Improvement Suggestions',hint:'Specific actionable improvements',req:false},
    {id:'next',icon:'🎪',label:'Next Phase Focus',hint:'next Weekphase key goals',req:true}
  ];
  // Extract dimension content from structured text
  function extractDim(label,text){
    var re=new RegExp(label+'[::]\s*');
    var m=text.match(re);if(!m)return'';
    var rest=text.substring(m.index+m[0].length);
    // Find next dimension header
    var nextLabels=dims.map(function(d){return h.label;}).join('|');
    var next=rest.search(new RegExp('\n(?:'+nextLabels+')[::]'));
    if(next<0)next=rest.length;
    return rest.substring(0,next).trim();
  }
  var h='';
  dims.forEach(function(d){
    var content=extractDim(d.label,text);
    if(!content&&!d.req)return; // Skip empty optional dimensions
    h+='<div class="mf-dim '+d.id+'"><div class="mf-dim-label"><span class="mf-dim-icon">'+d.icon+'</span>'+d.label+(d.req?' <span style="font-size:10px;color:var(--text-muted);font-weight:400">Required</span>':' <span style="font-size:10px;color:var(--text-muted);font-weight:400">Optional</span>')+'<span style="font-size:10px;color:var(--text-muted);font-weight:400;margin-left:6px">'+d.hint+'</span></div>';
    h+=content?'<div class="mf-dim-text">'+content.split(NL).join('<br>')+'</div>':'<div class="rpt-placeholder" style="padding-left:0">MentorNot filled</div>';
    h+='</div>';
  });
  return h;
}

function buildCompTrendCard(wkNum){ var weeks=intern.weeks;
  var card=_H('div',{c:'chart-box'});
  var hd=_H('div',{s:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'});
  hd.appendChild(_H('h4',{s:'font-size:13px;font-weight:700;color:var(--text-heading);margin:0'},'CompetencyTrend'));
  card.setAttribute('id','compTrendCard');hd.appendChild(mkChartWeekSelect(wkNum,'compTrendCard',buildCompTrendCard));
  card.appendChild(hd);
  var w=340,h=160,pl=38,pr=36,pt=14,pb=22,bw=28,gap=18;
  var ymax=100;
  function xs(i){return pl+i*(bw*2+gap)+bw/2;}
  function ys(v){return pt+((ymax-v)/ymax)*(h-pt-pb);}
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="max-width:100%;width:100%">';
  // Grid lines + Y-axis labels
  for(var g=0;g<=ymax;g+=20){
    var gy=ys(g);
    svg+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(w-pr)+'" y2="'+gy+'" stroke="#e8edea" stroke-width="0.5"/>';
    svg+='<text x="'+(pl-5)+'" y="'+gy+'" text-anchor="end" font-size="9" fill="#80828a" dominant-baseline="middle">'+g+'</text>';
  }
  // Dual bars (rate=green left, quality=blue right) + Competency line
  var compPts=[];
  weeks.forEach(function(wk,i){
    var x=xs(i),c=Math.round(wk.rate*wk.quality/100);
    // Rate bar (green, left side of pair)
    var rateH=ys(wk.rate)-ys(0);
    svg+='<rect x="'+(x-bw-2).toFixed(0)+'" y="'+ys(wk.rate).toFixed(1)+'" width="'+(bw-2)+'" height="'+rateH.toFixed(1)+'" fill="#2cc56f" rx="3" opacity="0.85"/>';
    // Quality bar (blue, right side of pair)
    var qualH=ys(wk.quality)-ys(0);
    svg+='<rect x="'+(x+2).toFixed(0)+'" y="'+ys(wk.quality).toFixed(1)+'" width="'+(bw-2)+'" height="'+qualH.toFixed(1)+'" fill="#3B82F6" rx="3" opacity="0.85"/>';
    // Competency point + line
    compPts.push(x.toFixed(1)+','+ys(c).toFixed(1));
    svg+='<circle cx="'+x.toFixed(1)+'" cy="'+ys(c).toFixed(1)+'" r="4" fill="#fff" stroke="#e17100" stroke-width="2.5"/>';
    // Week label
    svg+='<text x="'+x.toFixed(0)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="#80828a">W'+(i+1)+'</text>';
  });
  // Competency trend line (behind dots but visible)
  svg+='<polyline points="'+compPts.join(' ')+'" fill="none" stroke="#e17100" stroke-width="2.2" stroke-linejoin="round"/>';
  svg+='</svg>';
  card.appendChild(el(svg));
  card.appendChild(el('<div class="chart-legend"><span><i class="ld" style="background:#2cc56f"></i>Completion Rate</span><span><i class="ld" style="background:#3B82F6"></i>Quality</span><span><i class="ld" style="background:#e17100"></i>Competency</span></div>'));
  return card;
}function buildTaskQualityCard(wkNum){

  card.appendChild(hd);
  var data=[{wk:1,high:2,pass:2,fail:1,none:0},{wk:2,high:3,pass:1,fail:1,none:0},{wk:3,high:2,pass:2,fail:0,none:1},{wk:4,high:3,pass:2,fail:0,none:0}];
  var w=340,h=160,pl=30,pr=10,pt=14,pb=20,bw=32;
  var maxTasks=Math.max.apply(null,data.map(function(d){return d.high+d.pass+d.fail+d.none;}));

  function ys(v){return pt+((maxTasks-v)/maxTasks)*(h-pt-pb);}
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="max-width:100%;width:100%">';
  for(var g=0;g<=maxTasks;g+=2){var gy=ys(g);svg+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(w-pr)+'" y2="'+gy+'" stroke="#e8edea" stroke-width="0.5"/><text x="'+(pl-4)+'" y="'+gy+'" text-anchor="end" font-size="9" fill="#80828a" dominant-baseline="middle">'+g+'</text>';}
  var colors={high:'#2cc56f',pass:'#3B82F6',fail:'#F59E0B',none:'#e0e0e0'};
  var order=['high','pass','fail','none'];
  data.forEach(function(d,i){
    var x=xs(i),stack=0;
    order.forEach(function(k){
      if(d[k]>0){var bh=ys(stack)-ys(stack+d[k]);svg+='<rect x="'+x.toFixed(0)+'" y="'+ys(stack+d[k]).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" fill="'+colors[k]+'" rx="3"/>';stack+=d[k];}
    });
    svg+='<text x="'+(x+bw/2).toFixed(0)+'" y="'+(h-4)+'" text-anchor="middle" font-size="9" fill="#80828a">W'+(i+1)+'</text>';
  });
  svg+='</svg>';
  card.appendChild(el(svg));
  card.appendChild(el('<div class="chart-legend"><span><i class="ld" style="background:#2cc56f"></i>High</span><span><i class="ld" style="background:#3B82F6"></i>Pass</span><span><i class="ld" style="background:#F59E0B"></i>Needs Fix</span><span><i class="ld" style="background:#e0e0e0"></i>No Feedback</span></div>'));
  return card;
}
function buildLearningCard(wkNum){
  var card=_H('div',{c:'chart-box'});
  var hd=_H('div',{s:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'});
  hd.appendChild(_H('h4',{s:'font-size:13px;font-weight:700;color:var(--text-heading);margin:0'},'Learning Transfer'));
  card.setAttribute('id','learnCard');hd.appendChild(mkChartWeekSelect(wkNum,'learnCard',buildLearningCard));
  card.appendChild(hd);
  var data=[{wk:1,hours:3.5,pass:60},{wk:2,hours:5,pass:72},{wk:3,hours:2,pass:68},{wk:4,hours:4.5,pass:80}];
  var w=340,h=160,pl=36,pr=36,pt=10,pb=20,bw=28;
  var maxH=Math.ceil(Math.max.apply(null,data.map(function(d){return d.hours;})));
  function xs(i){return pl+i*((w-pl-pr-bw*4)/3+bw)+bw/2;}
  function ysh(v){return pt+((maxH-v)/maxH)*(h-pt-pb);}
  function ysp(v){return pt+((100-v)/100)*(h-pt-pb);}
  var svg='<svg viewBox="0 0 '+w+' '+h+'" style="max-width:100%;width:100%">';
  for(var g=0;g<=maxH;g+=1){var gy=ysh(g);svg+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(w-pr)+'" y2="'+gy+'" stroke="#e8edea" stroke-width="0.5"/><text x="'+(pl-4)+'" y="'+gy+'" text-anchor="end" font-size="9" fill="#80828a" dominant-baseline="middle">'+g+'h</text>';}
  for(var g=0;g<=100;g+=20){svg+='<text x="'+(w-pr+6)+'" y="'+ysp(g).toFixed(0)+'" font-size="9" fill="#3B82F6" dominant-baseline="middle">'+g+'%</text>';}
  var passPts=[];
  data.forEach(function(d,i){
    var x=xs(i),bh=ysh(0)-ysh(d.hours);
    svg+='<rect x="'+(x-bw/2).toFixed(0)+'" y="'+ysh(d.hours).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" fill="#2cc56f" rx="3" opacity="0.8"/>';
    svg+='<text x="'+x.toFixed(0)+'" y="'+(h-4)+'" text-anchor="middle" font-size="9" fill="#80828a">W'+(i+1)+'</text>';
    passPts.push(x.toFixed(1)+','+ysp(d.pass).toFixed(1));
  });
  svg+='<polyline points="'+passPts.join(' ')+'" fill="none" stroke="#3B82F6" stroke-width="2"/>';
  data.forEach(function(d,i){svg+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ysp(d.pass).toFixed(1)+'" r="3" fill="#3B82F6"/>';});
  svg+='</svg>';
  card.appendChild(el(svg));
  card.appendChild(el('<div class="chart-legend"><span><i class="ld" style="background:#2cc56f"></i>Study Hours</span><span><i class="ld" style="background:#3B82F6"></i>Pass Rate</span></div>'));
  return card;
}
function mkChartWeekSelect(currentWkNum,cardId,rebuildFn){
  var sel=_H('select',{c:'wk-select',s:'font-size:12px;padding:5px 10px'});
  allWeeks.forEach(function(wk){
    var opt=document.createElement('option');
    opt.value=wk;opt.textContent='W'+wk+'Week';
    if(wk===currentWkNum)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=function(){
    var w=parseInt(sel.value);
    var card=document.getElementById(cardId);
    var container=card?card.parentNode:null;
    if(container){
      var newCard=rebuildFn(w);
      if(newCard)container.replaceChild(newCard,card);
    }
  };
  return sel;
}
function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstChild;}

// ═══════ INITIAL RENDER ═══════
try{buildTabs(currentWk);main.innerHTML='';main.appendChild(frag);}catch(e){main.innerHTML='<div class="emp" style="padding-top:80px"><p style="font-size:18px;font-weight:600;color:var(--red)">Error</p><p>'+e.message+'</p></div>';}
})();
</script>
